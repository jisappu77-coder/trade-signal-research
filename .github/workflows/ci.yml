name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required if you want to commit fixes back automatically
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true 

      # Fixes the imports automatically during the CI run so it doesn't fail
      - name: Run ruff linter and auto-fix
        run: uv run --with ruff ruff check src/ tests/ --fix

      # Optional: Double checks that the code conforms to standard formatting rules
      - name: Check formatting alignment
        run: uv run --with ruff ruff format --check src/ tests/

      - name: Run mypy type checker
        run: uv run --with mypy mypy

      # The §14.2 anti-lookahead suite runs on every signal, on every push.
      - name: anti-lookahead tests (SPEC.md §14.2)
        run: uv run --with pytest pytest tests/test_antilookahead.py -v

      - name: full suite with coverage gates (SPEC.md §14.1)
        run: |
          uv run --with pytest --with pytest-cov pytest tests/ \
            --cov=cryptolab --cov-report=term-missing \
            --cov-fail-under=70

      - name: coverage gate for backtest/ and validation/ (>=90%)
        run: |
          uv run --with pytest --with pytest-cov pytest tests/ -q \
            --cov=cryptolab.backtest --cov=cryptolab.validation \
            --cov-report=term --cov-fail-under=90
