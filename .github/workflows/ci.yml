name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true 

      # Automatically resolves import order errors natively during execution
      - name: Run ruff linter and auto-fix
        run: uv run --with ruff ruff check src/ tests/ --fix

      # Re-formats the code inside the runner workspace so subsequent tools pass cleanly
      - name: Auto-format workspace layout
        run: uv run --with ruff ruff format src/ tests/

      # Fix: Installed missing stubs interactively and pointed to the explicit package source layout root
      - name: Run mypy type checker
        run: |
          MYPYPATH=src uv run --with mypy mypy src/ \
            --install-types --non-interactive \
            --explicit-package-bases \
            --namespace-packages

      # The §14.2 anti-lookahead suite runs on every signal, on every push.
      - name: anti-lookahead tests (SPEC.md §14.2)
        run: uv run --with pytest pytest tests/test_antilookahead.py -v

      - name: full suite with coverage gates (SPEC.md §14.1)
        run: |
          uv run --with pytest --with pytest-cov pytest tests/ \
            --cov=cryptolab --cov-report=term-missing \
            --cov-fail-under=70

      - name: coverage gate for backtest/ and validation/ (>=90%)
        run: |
          uv run --with pytest --with pytest-cov pytest tests/ -q \
            --cov=cryptolab.backtest --cov=cryptolab.validation \
            --cov-report=term --cov-fail-under=90
            
