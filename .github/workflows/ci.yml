name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true # Ensures lightning-fast subsequent runs

      - name: Run ruff linter
        run: uv run ruff check src/ tests/

      - name: Run mypy type checker
        run: uv run mypy

      # The §14.2 anti-lookahead suite runs on every signal, on every push.
      - name: anti-lookahead tests (SPEC.md §14.2)
        run: uv run pytest tests/test_antilookahead.py -v

      - name: full suite with coverage gates (SPEC.md §14.1)
        run: |
          uv run pytest tests/ \
            --cov=cryptolab --cov-report=term-missing \
            --cov-fail-under=70

      - name: coverage gate for backtest/ and validation/ (>=90%)
        run: |
          uv run pytest tests/ -q \
            --cov=cryptolab.backtest --cov=cryptolab.validation \
            --cov-report=term --cov-fail-under=90
